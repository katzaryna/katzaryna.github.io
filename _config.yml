title: Katzaryna — Katsiaryna Zarouskaya, Illustrator in Warsaw
description: 'Katsiaryna Zarouskaya (Katzaryna), illustrator in Warsaw: packaging, editorial and book
  illustration with expressive characters, warm colour and small stories.'
url: https://katzaryna.github.io
