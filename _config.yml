artist:
  name: Katzaryna
  full_name: Katsiaryna Zarouskaya
  description: Commercial Illustrator
  bio: >-
    Katsiaryna Zarouskaya is an illustrator and packaging designer based in Warsaw, Poland, specialising
    in lifestyle, editorial and brand illustration. Her work is characterized by expressive characters,
    vibrant colours and playful compositions that capture the small pleasures of everyday life. Drawing
    inspiration from human connections, wellbeing and contemporary lifestyle, Katsiaryna creates uplifting,
    atmospheric illustrations filled with warmth, personality and a sense of movement. Her practice spans
    editorial illustration, packaging concepts and visual storytelling, with a particular interest in
    beauty, wellness and lifestyle brands. Combining decorative detail with engaging narratives, she brings
    a distinctive visual identity to both print and commercial projects.
  portrait: /assets/images/avatar.png
  portrait_alt: Katzaryna
  email: katzaryna@gmail.com
  linkedin_url: https://www.linkedin.com/in/katsiaryna-zarouskaya-9083a5105
  instagram_url: https://www.instagram.com/kat.zaryna/
  wordmark_image: /assets/images/wordmark-screenshot-2026-11-11-at-02-14-31-2.webp
