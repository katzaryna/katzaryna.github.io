<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Selected paintings and contact information for artist Katzaryna.">
    <meta name="theme-color" content="#f7f6f2">
    <title>Katzaryna — Artist</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header class="page">
      <a href="./">Katzaryna</a>
      <span>Artist</span>
    </header>

    <main class="page">
      <section aria-label="Selected paintings">
        <div class="works">
          <figure>
            <a class="gallery-link" href="projects/landscapes/" aria-label="View the Landscapes project">
              <img src="projects/landscapes/images/01.svg" alt="Abstract landscape in green and ochre">
            </a>
          </figure>
          <figure>
            <a class="gallery-link" href="projects/flowers/" aria-label="View the Flowers project">
              <img src="projects/flowers/images/01.svg" alt="Flowers against a terracotta background">
            </a>
          </figure>
          <figure>
            <a class="gallery-link" href="projects/evening-sun/" aria-label="View the Evening Sun project">
              <img src="projects/evening-sun/images/01.svg" alt="Sun above a calm sea">
            </a>
          </figure>
        </div>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Get in touch</h2>
        <p>For commissions and enquiries:<br><a href="mailto:katzaryna@gmail.com">katzaryna@gmail.com</a></p>
      </section>
    </main>

    <footer class="page">
      <span>© 2026 Katzaryna</span>
      <a href="mailto:katzaryna@gmail.com">Email</a>
    </footer>

    <aside class="consent" id="analytics-consent" aria-label="Analytics settings" hidden>
      <p>This site uses Google Analytics to understand how visitors use it. You can choose whether to allow analytics.</p>
      <button type="button" id="accept-analytics">Allow</button>
      <button type="button" id="reject-analytics">Decline</button>
    </aside>

    <script src="assets/js/analytics.js"></script>
  </body>
</html>
